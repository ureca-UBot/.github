schema_version: 1
product:
  id: ubot
  name: UBot
  audience: "통신 상품·이용·매장 정보를 찾고 AI 또는 상담사에게 문의하는 고객과 이를 운영하는 관리자·상담사"
  release_model: coordinated
  publication_status: template
  owner: "UBot maintainers"

repositories:
  product_docs_repo:
    url: "https://github.com/ureca-UBot/.github"
    owner: "UBot maintainers"
  backend_repo:
    url: "https://github.com/ureca-UBot/UBot-BE"
    owner: "UBot Backend maintainers"
  frontend_repo:
    url: "https://github.com/ureca-UBot/UBot-FE"
    owner: "UBot Frontend maintainers"
  llm_test_repo:
    url: "https://github.com/ureca-UBot/UBot-LLMTest"
    owner: "UBot LLM research maintainers"
  embedding_test_repo:
    url: "https://github.com/ureca-UBot/UBot-EmbeddingTest"
    owner: "UBot embedding research maintainers"
  vector_db_test_repo:
    url: "https://github.com/ureca-UBot/UBot-VertorDBTest"
    owner: "UBot vector database research maintainers"

components:
  backend:
    name: UBot Backend
    responsibility: "인증·업무 API, 대화·상담·FAQ 상태, 비동기 답변 처리와 모델 연동"
    repositories: [backend_repo]
    owns: [http_api, persistent_state, async_answer_processing, model_integration]
    must_not_own: [browser_user_interface, model_comparison_evidence]
  frontend:
    name: UBot Frontend
    responsibility: "고객·상담사·관리자 웹 화면, 브라우저 상태와 백엔드 API 소비"
    repositories: [frontend_repo]
    owns: [web_user_interface, browser_state, client_api_integration]
    must_not_own: [server_authorization_decision, database_schema, model_quality_claim]

artifacts:
  backend_service:
    component: backend
    repository: backend_repo
    type: service
  frontend_web:
    component: frontend
    repository: frontend_repo
    type: web
