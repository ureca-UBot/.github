<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1150" viewBox="0 0 640 1150" role="img" aria-labelledby="title desc">
<title id="title">UBot은 질문을 답변과 상담으로 연결합니다</title>
<desc id="desc">고객이 상품, 이용 정보, 매장을 질문하면 공식 FAQ와 권한을 확인한 자료를 조회해 답변과 카드를 제공합니다. 로그인한 고객이 요청하면 이전 대화를 상담사에게 전달하고 메시지를 검사합니다. 근거가 부족한 질문은 관리자의 FAQ 보완과 다음 검색으로 이어집니다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M1 1L9 5L1 9" fill="none" stroke="#A4A4B6" stroke-width="1.5"/>
</marker>
</defs>
<rect width="640" height="1150" fill="#FFF" rx="28"/>
<g font-family="'SUITE','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="40" y="47" font-size="20" fill="#D91370" font-weight="750">UBot</text>
<text x="40" y="100" font-size="35" fill="#20202A" font-weight="750">질문부터 답변과 상담까지</text>
<text x="40" y="140" font-size="27" fill="#62626E" font-weight="500">상품 · 내 이용 정보 · 매장 안내</text>
<rect x="40" y="176" width="560" height="150" rx="24" fill="#FFF" stroke="#DEDEE8" stroke-width="1.5"/>
<text x="64" y="213" font-size="20" fill="#D91370" font-weight="700">01 · 고객</text>
<text x="64" y="255" font-size="32" fill="#20202A" font-weight="750">궁금한 내용을 질문</text>
<text x="64" y="299" font-size="27" fill="#62626E" font-weight="500">“내 사용량 알려줘”</text>
<path d="M320 332L320 344" fill="none" stroke="#A4A4B6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="560" height="150" rx="24" fill="#FFF" stroke="#DEDEE8" stroke-width="1.5"/>
<text x="64" y="387" font-size="20" fill="#D91370" font-weight="700">02 · UBot</text>
<text x="64" y="429" font-size="32" fill="#20202A" font-weight="750">공식 자료 확인</text>
<text x="64" y="473" font-size="27" fill="#62626E" font-weight="500">공식 FAQ와 필요한 자료 조회</text>
<path d="M320 506L320 518" fill="none" stroke="#A4A4B6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="524" width="560" height="150" rx="24" fill="#FFF" stroke="#DEDEE8" stroke-width="1.5"/>
<text x="64" y="561" font-size="20" fill="#D91370" font-weight="700">03 · 결과</text>
<text x="64" y="603" font-size="32" fill="#20202A" font-weight="750">답변·카드로 안내</text>
<text x="64" y="647" font-size="27" fill="#62626E" font-weight="500">검사한 답변과 조회 결과 표시</text>
<path d="M320 681L320 709" fill="none" stroke="#A4A4B6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="721" width="560" height="171" rx="24" fill="#FFF0F7" stroke="#FFF0F7" stroke-width="1.5"/>
<text x="64" y="761" font-size="25" fill="#D91370" font-weight="700">사람의 도움이 필요하면</text>
<text x="64" y="807" font-size="31" fill="#20202A" font-weight="750">로그인한 고객이 상담사를 호출</text>
<text x="64" y="852" font-size="27" fill="#62626E" font-weight="500">이전 내역 전달 · 메시지 검사 후 상담</text>
<rect x="40" y="932" width="560" height="180" rx="24" fill="#F3F0FF" stroke="#F3F0FF" stroke-width="1.5"/>
<text x="64" y="972" font-size="26" fill="#6F55DD" font-weight="700">답변 근거가 부족한 질문은</text>
<text x="64" y="1024" font-size="29" fill="#20202A" font-weight="750">미응답 수집 → 관리자 FAQ 보완</text>
<text x="64" y="1070" font-size="28" fill="#20202A" font-weight="500">→ 다음 질문의 검색에 반영</text>
</g>
</svg>
