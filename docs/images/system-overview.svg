<path d="M600 280 L600 316" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="230" y="325" width="740" height="140" rx="22" fill="#F3F0FF" stroke="#F3F0FF" stroke-width="1.5"/>
<text x="600" y="373" font-size="30" fill="#6F55DD" font-weight="750" text-anchor="middle">서비스 서버 · UBot-BE</text>
