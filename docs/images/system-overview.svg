<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">UBot 조직 수준 시스템 구성</title>
  <desc id="desc">사용자 채널에서 프론트엔드와 백엔드 API를 거쳐 업무 기능과 비동기 답변 처리, 데이터 계층, 모델 런타임으로 이어지고 관측 신호와 연구 근거가 운영 판단과 기술 결정으로 연결되는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca3c7"/>
    </marker>
    <style>
      .title { fill:#f8fafc; font:700 30px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .subtitle { fill:#a8bad4; font:500 17px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .card-title { fill:#f8fafc; font:700 21px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .card-body { fill:#cfdbeb; font:500 16px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .label { fill:#8fa5c6; font:600 14px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .line { stroke:#8ca3c7; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#7188ad; stroke-width:2.5; fill:none; stroke-dasharray:8 7; marker-end:url(#arrow); }
      .card { stroke-width:1.5; filter:url(#shadow); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="26" fill="url(#bg)"/>
  <text x="60" y="62" class="title">UBot System Overview</text>
  <text x="60" y="92" class="subtitle">운영 경로와 실험 근거를 분리하고, 기술 결정으로 연결합니다.</text>

  <rect x="60" y="126" width="1080" height="72" rx="18" fill="#17243a" stroke="#30435f" class="card"/>
  <text x="600" y="156" text-anchor="middle" class="card-title">고객 · 상담사 · 관리자 · 운영자</text>
  <text x="600" y="181" text-anchor="middle" class="card-body">질문, 상담, 지식 관리와 운영 대응</text>

  <rect x="75" y="244" width="220" height="110" rx="20" fill="#12345a" stroke="#3282c8" class="card"/>
  <text x="185" y="282" text-anchor="middle" class="card-title">UBot-FE</text>
  <text x="185" y="310" text-anchor="middle" class="card-body">웹 경험 · 브라우저 상태</text>
  <text x="185" y="333" text-anchor="middle" class="card-body">고객 · 상담사 · 관리자 화면</text>

  <rect x="370" y="226" width="250" height="146" rx="20" fill="#28356e" stroke="#6574d9" class="card"/>
  <text x="495" y="266" text-anchor="middle" class="card-title">UBot-BE API</text>
  <text x="495" y="296" text-anchor="middle" class="card-body">회원 · 상품 · 이용 정보</text>
  <text x="495" y="322" text-anchor="middle" class="card-body">매장 · 예약 · 문의 · 알림</text>
  <text x="495" y="348" text-anchor="middle" class="card-body">FAQ · 상담 · 관리자 업무</text>

  <rect x="690" y="226" width="250" height="146" rx="20" fill="#4c286d" stroke="#a66ad2" class="card"/>
  <text x="815" y="266" text-anchor="middle" class="card-title">비동기 답변 처리</text>
  <text x="815" y="296" text-anchor="middle" class="card-body">FAQ 검색 · 업무 자료 조합</text>
  <text x="815" y="322" text-anchor="middle" class="card-body">모델 연결 · 안전 검사</text>
  <text x="815" y="348" text-anchor="middle" class="card-body">답변 저장 · 중단 작업 회수</text>

  <rect x="985" y="244" width="155" height="110" rx="20" fill="#6b361d" stroke="#da7b3e" class="card"/>
  <text x="1062" y="282" text-anchor="middle" class="card-title">AI Runtime</text>
  <text x="1062" y="310" text-anchor="middle" class="card-body">LLM</text>
  <text x="1062" y="333" text-anchor="middle" class="card-body">Embedding</text>

  <path d="M 600 198 V 212 H 185 V 242" class="line"/>
  <path d="M 295 299 H 368" class="line"/>
  <path d="M 620 299 H 688" class="line"/>
  <path d="M 940 299 H 983" class="line"/>
  <text x="653" y="286" text-anchor="middle" class="label">비동기 작업</text>

  <rect x="370" y="416" width="250" height="112" rx="20" fill="#124c4b" stroke="#2f9e9a" class="card"/>
  <text x="495" y="456" text-anchor="middle" class="card-title">PostgreSQL / pgvector</text>
  <text x="495" y="486" text-anchor="middle" class="card-body">제품·대화·작업 원본</text>
  <text x="495" y="510" text-anchor="middle" class="card-body">FAQ · Vector 검색</text>

  <rect x="690" y="416" width="250" height="112" rx="20" fill="#16415a" stroke="#3d8bb8" class="card"/>
  <text x="815" y="456" text-anchor="middle" class="card-title">Redis</text>
  <text x="815" y="486" text-anchor="middle" class="card-body">작업 전달</text>
  <text x="815" y="510" text-anchor="middle" class="card-body">Cache · Ranking · Lock</text>

  <path d="M 495 372 V 414" class="line"/>
  <path d="M 815 372 V 414" class="line"/>
  <path d="M 730 372 V 392 H 600 V 414" class="line"/>

  <rect x="370" y="546" width="570" height="30" rx="15" fill="#21334b" stroke="#587093"/>
  <text x="655" y="567" text-anchor="middle" class="label">상태 확인 · 지표 · 로그 · 알림 · 장애별 런북</text>

  <rect x="60" y="582" width="695" height="92" rx="20" fill="#18263c" stroke="#405574" class="card"/>
  <text x="90" y="620" class="card-title">Research / Benchmark</text>
  <text x="90" y="649" class="card-body">UBot-LLMTest · UBot-EmbeddingTest · UBot-VertorDBTest</text>

  <rect x="840" y="582" width="300" height="92" rx="20" fill="#27334a" stroke="#7188ad" class="card"/>
  <text x="990" y="620" text-anchor="middle" class="card-title">Evidence → Decision</text>
  <text x="990" y="649" text-anchor="middle" class="card-body">검증 근거를 운영 구현에 연결</text>

  <path d="M 755 628 H 838" class="dash"/>
  <path d="M 990 582 V 390 H 900 V 372" class="dash"/>
</svg>
