<text x="348" y="645" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">작업 전달 신호</text>
<text x="348" y="681" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">빠른 조회 캐시</text>
<path d="M743 510 L743 545" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="612" y="555" width="262" height="155" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
