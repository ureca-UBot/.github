<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="885" viewBox="0 0 1200 885" role="img" aria-labelledby="title desc">
<title id="title">UBot 시스템 구성</title>
<desc id="desc">사용자 웹 화면에서 서버로 요청하고 서버가 데이터 저장소, 모델, 외부 위치 서비스에 연결</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#A8A8BA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1200" height="885" rx="28" fill="#FFFFFF"/>
<g font-family="'SUITE','Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="40" y="52" font-size="18" fill="#D91370" font-weight="750" text-anchor="start">UBot</text>
<text x="40" y="105" font-size="40" fill="#20202A" font-weight="750" text-anchor="start">화면과 서버, 데이터와 모델의 연결</text>
<path d="M40 132 L1160 132" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round"/>
<rect x="290" y="172" width="620" height="100" rx="22" fill="#FFF0F7" stroke="#FFF0F7" stroke-width="1.5"/>
