<text x="600" y="446" font-size="21" fill="#63636F" font-weight="500" text-anchor="middle">권한과 처리 결과를 확인하고 화면에 반환</text>
<path d="M600 472 L600 508" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round"/>
<path d="M171 510 L1029 510" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round"/>
<path d="M171 510 L171 545" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
