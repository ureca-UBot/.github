<text x="634" y="681" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">근거 기반 답변 생성</text>
<path d="M1029 510 L1029 545" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="898" y="555" width="262" height="155" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="920" y="601" font-size="27" fill="#20202A" font-weight="750" text-anchor="start">위치·길찾기</text>
<text x="920" y="645" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">장소·경로 조회</text>
<text x="920" y="681" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">외부 지도 서비스</text>
