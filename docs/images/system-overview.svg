<text x="65" y="790" font-size="24" fill="#147A5B" font-weight="750" text-anchor="start">배포·관측</text>
<text x="65" y="824" font-size="23" fill="#20202A" font-weight="500" text-anchor="start">CI/CD · 상태·지표·로그 · 장애 알림 · 저장된 결과로 복구 확인</text>
