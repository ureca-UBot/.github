<text x="62" y="645" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">업무·대화·최종 결과</text>
<text x="62" y="681" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">pgvector 검색</text>
