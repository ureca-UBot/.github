<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1710" viewBox="0 0 640 1710" role="img" aria-labelledby="title desc">
<title id="title">질문에서 답변까지</title>
<desc id="desc">FAQ 준비, 질문 접수, 검색, 자료 조회, 답변 검사와 결과 표시</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#A8A8BA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="640" height="1710" rx="28" fill="#FFFFFF"/>
<g font-family="'SUITE','Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="40" y="52" font-size="18" fill="#D91370" font-weight="750" text-anchor="start">UBot · AI 상담</text>
<text x="40" y="105" font-size="34" fill="#20202A" font-weight="750" text-anchor="start">질문에서 답변까지</text>
