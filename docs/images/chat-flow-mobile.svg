<text x="62" y="1174" font-size="32" fill="#20202A" font-weight="750" text-anchor="start">답변 생성과 안전 검사</text>
<text x="62" y="1210" font-size="26" fill="#63636F" font-weight="500" text-anchor="start">근거·수치·위험 표현을 확인</text>
<path d="M320 1243 L320 1257" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="40" y="1263" width="560" height="151" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<rect x="60" y="1281" width="150" height="36" rx="18" fill="#FFF0F7" stroke="#FFF0F7" stroke-width="1.5"/>
