<rect x="40" y="1086" width="560" height="151" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<rect x="60" y="1104" width="80" height="36" rx="18" fill="#FFF0F7" stroke="#FFF0F7" stroke-width="1.5"/>
