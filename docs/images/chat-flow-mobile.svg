<text x="62" y="997" font-size="32" fill="#20202A" font-weight="750" text-anchor="start">업무 자료·조회 도구 연결</text>
<text x="62" y="1033" font-size="26" fill="#63636F" font-weight="500" text-anchor="start">본인 이용 정보·상품·매장 자료 확인</text>
