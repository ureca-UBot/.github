<text x="62" y="1351" font-size="32" fill="#20202A" font-weight="750" text-anchor="start">결과 저장과 화면 표시</text>
<text x="62" y="1387" font-size="26" fill="#63636F" font-weight="500" text-anchor="start">답변·카드 확인 후 다음 행동 선택</text>
<rect x="40" y="1460" width="560" height="212" rx="22" fill="#F3F0FF" stroke="#F3F0FF" stroke-width="1.5"/>
<text x="64" y="1503" font-size="30" fill="#6F55DD" font-weight="750" text-anchor="start">공식 FAQ 직접 반환</text>
<text x="64" y="1551" font-size="26" fill="#20202A" font-weight="500" text-anchor="start">검색 조건 충족 → 출력 코드 검사</text>
<text x="64" y="1594" font-size="26" fill="#20202A" font-weight="500" text-anchor="start">→ 결과 저장·화면 표시</text>
<text x="64" y="1640" font-size="25" fill="#63636F" font-weight="500" text-anchor="start">답변 생성·출력 AI 판정은 생략</text>
