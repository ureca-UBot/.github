<path d="M320 535 L320 549" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="40" y="555" width="560" height="151" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
