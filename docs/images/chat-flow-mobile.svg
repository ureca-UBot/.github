<text x="100" y="598" font-size="18" fill="#D91370" font-weight="700" text-anchor="middle">02 · BE</text>
<text x="62" y="643" font-size="32" fill="#20202A" font-weight="750" text-anchor="start">권한·입력 확인과 접수</text>
<text x="62" y="679" font-size="26" fill="#63636F" font-weight="500" text-anchor="start">대화 소유권을 확인하고 작업 저장</text>
<path d="M320 712 L320 726" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
