<text x="64" y="256" font-size="26" fill="#20202A" font-weight="500" text-anchor="start">FAQ 등록·수정 → 질문 표현 임베딩</text>
<text x="64" y="300" font-size="26" fill="#20202A" font-weight="500" text-anchor="start">현재 버전·프로필의 검색 색인 준비</text>
