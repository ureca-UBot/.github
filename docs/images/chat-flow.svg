  <text x="645" y="455" text-anchor="middle" class="card-body">HNSW FAQ 검색</text>
  <text x="645" y="476" text-anchor="middle" class="small">현재 버전 · Profile만 사용</text>

  <rect x="800" y="354" width="214" height="130" rx="18" fill="#325339" stroke="#69a477" class="card"/>
  <text x="907" y="386" text-anchor="middle" class="card-title">근거와 업무 자료</text>
  <text x="907" y="411" text-anchor="middle" class="card-body">FAQ 문장 선별</text>
  <text x="907" y="433" text-anchor="middle" class="card-body">회원 · 상품 · 매장 조회</text>
  <text x="907" y="455" text-anchor="middle" class="card-body">허용된 조회 도구만 연결</text>
  <text x="907" y="476" text-anchor="middle" class="small">권한과 소유권은 서버가 검사</text>

  <rect x="538" y="534" width="214" height="112" rx="18" fill="#6b361d" stroke="#da7b3e" class="card"/>
  <text x="645" y="566" text-anchor="middle" class="card-title">답변 모델</text>
  <text x="645" y="592" text-anchor="middle" class="card-body">선별한 근거와 자료 사용</text>
  <text x="645" y="616" text-anchor="middle" class="card-body">답변 상태 · 근거 반환</text>

  <rect x="800" y="534" width="214" height="112" rx="18" fill="#5a2947" stroke="#bd668e" class="card"/>
  <text x="907" y="566" text-anchor="middle" class="card-title">출력 검사와 저장</text>
  <text x="907" y="592" text-anchor="middle" class="card-body">구조 · 근거 · 수치 · 위험 검사</text>
  <text x="907" y="616" text-anchor="middle" class="card-body">답변 · 카드 · FAQ 사용 기록</text>

  <rect x="1046" y="366" width="92" height="280" rx="18" fill="#17364f" stroke="#3d8bb8" class="card"/>
  <text x="1092" y="401" text-anchor="middle" class="card-title">화면</text>
  <text x="1092" y="430" text-anchor="middle" class="card-body">답변</text>
  <text x="1092" y="454" text-anchor="middle" class="card-body">상품</text>
  <text x="1092" y="478" text-anchor="middle" class="card-body">이용 정보</text>
  <text x="1092" y="502" text-anchor="middle" class="card-body">매장 · 지도</text>
  <text x="1092" y="526" text-anchor="middle" class="card-body">평가</text>
  <text x="1092" y="550" text-anchor="middle" class="card-body">다시 검색</text>
  <text x="1092" y="574" text-anchor="middle" class="card-body">오류 안내</text>
  <text x="1092" y="612" text-anchor="middle" class="small">작업 상태를</text>
  <text x="1092" y="631" text-anchor="middle" class="small">계속 조회</text>

  <path d="M 252 419 H 298" class="line"/>
  <path d="M 490 419 H 536" class="line"/>
  <path d="M 752 419 H 798" class="line"/>
  <path d="M 907 484 V 510 H 645 V 532" class="line"/>
  <path d="M 752 590 H 798" class="line"/>
  <path d="M 1014 590 H 1044" class="line"/>
  <path d="M 1092 366 V 320 H 157 V 364" class="dash"/>
  <text x="627" y="318" text-anchor="middle" class="small">진행 상태 조회 · 완료 결과 반영</text>
  <path d="M 645 354 V 280 H 1021 V 250" class="dash"/>
  <text x="805" y="296" text-anchor="middle" class="small">준비된 FAQ 벡터 검색</text>

  <rect x="42" y="718" width="1116" height="150" rx="22" fill="#101d30" stroke="#30435f"/>
  <text x="62" y="746" class="lane">대화 이후의 연결</text>

  <rect x="70" y="772" width="240" height="66" rx="17" fill="#17364f" stroke="#3d8bb8" class="card"/>
  <text x="190" y="799" text-anchor="middle" class="card-title">대화 기록</text>
  <text x="190" y="823" text-anchor="middle" class="card-body">AI 문답 · FAQ 선택 · 상담 기록</text>

  <rect x="374" y="772" width="240" height="66" rx="17" fill="#325339" stroke="#69a477" class="card"/>
  <text x="494" y="799" text-anchor="middle" class="card-title">다음 행동</text>
  <text x="494" y="823" text-anchor="middle" class="card-body">의도별 재검색 · 상품 · 매장</text>

  <rect x="678" y="772" width="240" height="66" rx="17" fill="#5a2947" stroke="#bd668e" class="card"/>
  <text x="798" y="799" text-anchor="middle" class="card-title">상담사 인계</text>
  <text x="798" y="823" text-anchor="middle" class="card-body">서버 저장 이력으로 상담 연결</text>

  <rect x="982" y="772" width="144" height="66" rx="17" fill="#263b66" stroke="#5f79bf" class="card"/>
  <text x="1054" y="799" text-anchor="middle" class="card-title">지식 개선</text>
  <text x="1054" y="823" text-anchor="middle" class="card-body">미응답 → FAQ</text>

  <path d="M 310 805 H 372" class="line"/>
  <path d="M 614 805 H 676" class="line"/>
  <path d="M 918 805 H 980" class="line"/>
</svg>
