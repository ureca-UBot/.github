<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">UBot 질문에서 상담과 지식 개선까지</title>
  <desc id="desc">관리자의 FAQ 임베딩 준비와 사용자의 Frontend 질문이 Backend의 벡터 검색, 업무 자료 조회, 답변 생성과 검사, 결과 저장, 화면 카드와 상담사 인계로 이어지는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a8ca"/>
    </marker>
    <style>
      .title { fill:#f8fafc; font:700 30px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .subtitle { fill:#a8bad4; font:500 17px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .lane { fill:#90a8ca; font:700 15px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; letter-spacing:.4px; }
      .card-title { fill:#f8fafc; font:700 18px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .card-body { fill:#cfdbeb; font:500 14px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .small { fill:#9fb2cd; font:500 13px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .line { stroke:#90a8ca; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#7188ad; stroke-width:2.5; fill:none; stroke-dasharray:8 7; marker-end:url(#arrow); }
      .card { stroke-width:1.5; filter:url(#shadow); }
    </style>
  </defs>

  <rect width="1200" height="920" rx="26" fill="url(#bg)"/>
  <text x="54" y="58" class="title">질문에서 상담과 지식 개선까지</text>
  <text x="54" y="88" class="subtitle">FAQ 준비부터 답변·상담·지식 개선까지 하나의 대화 흐름으로 이어집니다.</text>

  <rect x="42" y="116" width="1116" height="164" rx="22" fill="#101d30" stroke="#30435f"/>
  <text x="62" y="143" class="lane">FAQ 검색 준비</text>

  <rect x="70" y="166" width="210" height="82" rx="17" fill="#263b66" stroke="#5f79bf" class="card"/>
  <text x="175" y="196" text-anchor="middle" class="card-title">관리자 지식 관리</text>
  <text x="175" y="220" text-anchor="middle" class="card-body">FAQ · 질문 표현 · 의도</text>
  <text x="175" y="240" text-anchor="middle" class="small">등록 · 수정 · 버전 이력</text>

  <rect x="352" y="166" width="210" height="82" rx="17" fill="#124c4b" stroke="#2f9e9a" class="card"/>
  <text x="457" y="196" text-anchor="middle" class="card-title">현재 FAQ 버전</text>
  <text x="457" y="220" text-anchor="middle" class="card-body">활성 질문 표현만 선택</text>
  <text x="457" y="240" text-anchor="middle" class="small">삭제 · 오래된 버전 제외</text>

  <rect x="634" y="166" width="210" height="82" rx="17" fill="#6b361d" stroke="#da7b3e" class="card"/>
  <text x="739" y="196" text-anchor="middle" class="card-title">Embedding Runtime</text>
  <text x="739" y="220" text-anchor="middle" class="card-body">질문 표현 → 벡터</text>
  <text x="739" y="240" text-anchor="middle" class="small">현재 Profile 기준</text>

  <rect x="916" y="166" width="210" height="82" rx="17" fill="#16415a" stroke="#3d8bb8" class="card"/>
  <text x="1021" y="196" text-anchor="middle" class="card-title">PostgreSQL / pgvector</text>
  <text x="1021" y="220" text-anchor="middle" class="card-body">FAQ 벡터 · HNSW</text>
  <text x="1021" y="240" text-anchor="middle" class="small">버전 · Profile 함께 저장</text>

  <path d="M 280 207 H 350" class="line"/>
  <path d="M 562 207 H 632" class="line"/>
  <path d="M 844 207 H 914" class="line"/>

  <rect x="42" y="306" width="1116" height="386" rx="22" fill="#101d30" stroke="#30435f"/>
  <text x="62" y="334" class="lane">실시간 질문 처리</text>

  <rect x="62" y="366" width="190" height="106" rx="18" fill="#12345a" stroke="#3282c8" class="card"/>
  <text x="157" y="397" text-anchor="middle" class="card-title">UBot-FE</text>
  <text x="157" y="422" text-anchor="middle" class="card-body">질문 · 대화 · 위치 권한</text>
  <text x="157" y="444" text-anchor="middle" class="card-body">진행 단계와 중단 요청</text>
  <text x="157" y="463" text-anchor="middle" class="small">통합 채팅 · 플로팅 채팅</text>

  <rect x="300" y="366" width="190" height="106" rx="18" fill="#28356e" stroke="#6574d9" class="card"/>
  <text x="395" y="397" text-anchor="middle" class="card-title">질문 접수</text>
  <text x="395" y="422" text-anchor="middle" class="card-body">인증 · 소유권 · 입력 검사</text>
  <text x="395" y="444" text-anchor="middle" class="card-body">대화 · 질문 · 작업 저장</text>
  <text x="395" y="463" text-anchor="middle" class="small">추적 식별자 반환</text>

  <rect x="538" y="354" width="214" height="130" rx="18" fill="#4c286d" stroke="#a66ad2" class="card"/>
