<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">질문과 FAQ 검색, 답변 처리 흐름</title>
<desc id="desc">관리자 FAQ 준비와 실시간 질문 처리, 공식 FAQ 직접 반환 분기</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#A8A8BA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1200" height="1200" rx="28" fill="#FFFFFF"/>
<g font-family="'SUITE','Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="40" y="52" font-size="18" fill="#D91370" font-weight="750" text-anchor="start">UBot</text>
<text x="40" y="105" font-size="40" fill="#20202A" font-weight="750" text-anchor="start">질문이 근거 있는 답변이 되기까지</text>
<path d="M40 132 L1160 132" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round"/>
<rect x="40" y="164" width="180" height="36" rx="18" fill="#F3F0FF" stroke="#F3F0FF" stroke-width="1.5"/>
<text x="130" y="189" font-size="18" fill="#6F55DD" font-weight="700" text-anchor="middle">관리자의 지식 준비</text>
<rect x="40" y="220" width="310" height="135" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="62" y="262" font-size="26" fill="#20202A" font-weight="750" text-anchor="start">FAQ 등록·수정</text>
<text x="62" y="298" font-size="21" fill="#63636F" font-weight="500" text-anchor="start">질문 표현과 공식 답변</text>
<path d="M195 361 L195 392" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="40" y="400" width="310" height="135" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="62" y="442" font-size="26" fill="#20202A" font-weight="750" text-anchor="start">질문 표현 임베딩</text>
<text x="62" y="478" font-size="21" fill="#63636F" font-weight="500" text-anchor="start">현재 버전·프로필 사용</text>
<path d="M195 541 L195 572" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="40" y="580" width="310" height="135" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="62" y="622" font-size="26" fill="#20202A" font-weight="750" text-anchor="start">검색 색인 준비</text>
<text x="62" y="658" font-size="21" fill="#63636F" font-weight="500" text-anchor="start">PostgreSQL · pgvector</text>
<path d="M 350 645 H 380 V 525 H 410" fill="none" stroke="#A8A8BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="420" y="185" width="740" height="116" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="444" y="213" font-size="17" fill="#D91370" font-weight="700" text-anchor="start">01 · FE</text>
<text x="444" y="249" font-size="28" fill="#20202A" font-weight="750" text-anchor="start">질문 입력</text>
<text x="444" y="281" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">대화 맥락과 필요한 위치를 전송</text>
<path d="M790 306 L790 320" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="420" y="325" width="740" height="116" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="444" y="353" font-size="17" fill="#D91370" font-weight="700" text-anchor="start">02 · BE</text>
<text x="444" y="389" font-size="28" fill="#20202A" font-weight="750" text-anchor="start">권한·입력 확인과 접수</text>
<text x="444" y="421" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">대화 소유권을 확인하고 작업 저장</text>
<path d="M790 446 L790 460" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="420" y="465" width="740" height="116" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="444" y="493" font-size="17" fill="#D91370" font-weight="700" text-anchor="start">03 · BE</text>
<text x="444" y="529" font-size="28" fill="#20202A" font-weight="750" text-anchor="start">질문 정리·임베딩·FAQ 검색</text>
<text x="444" y="561" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">현재 FAQ 버전과 같은 프로필로 검색</text>
<path d="M790 586 L790 600" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="420" y="605" width="740" height="116" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="444" y="633" font-size="17" fill="#D91370" font-weight="700" text-anchor="start">04 · BE</text>
<text x="444" y="669" font-size="28" fill="#20202A" font-weight="750" text-anchor="start">업무 자료·조회 도구 연결</text>
<text x="444" y="701" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">본인 이용 정보·상품·매장 자료 확인</text>
<path d="M790 726 L790 740" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="420" y="745" width="740" height="116" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="444" y="773" font-size="17" fill="#D91370" font-weight="700" text-anchor="start">05 · BE</text>
<text x="444" y="809" font-size="28" fill="#20202A" font-weight="750" text-anchor="start">답변 생성과 안전 검사</text>
<text x="444" y="841" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">근거·수치·위험 표현을 확인</text>
<path d="M790 866 L790 880" fill="none" stroke="#DFDFE8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="420" y="885" width="740" height="116" rx="22" fill="#FFF" stroke="#DFDFE8" stroke-width="1.5"/>
<text x="444" y="913" font-size="17" fill="#D91370" font-weight="700" text-anchor="start">06 · BE → FE</text>
<text x="444" y="949" font-size="28" fill="#20202A" font-weight="750" text-anchor="start">결과 저장과 화면 표시</text>
<text x="444" y="981" font-size="22" fill="#63636F" font-weight="500" text-anchor="start">답변·카드 확인 후 다음 행동 선택</text>
<rect x="40" y="1040" width="1120" height="130" rx="22" fill="#F3F0FF" stroke="#F3F0FF" stroke-width="1.5"/>
<text x="66" y="1083" font-size="26" fill="#6F55DD" font-weight="750" text-anchor="start">조건에 맞는 공식 FAQ는 바로 반환합니다</text>
<text x="66" y="1120" font-size="23" fill="#20202A" font-weight="500" text-anchor="start">검색 조건 충족 → 등록 답변의 출력 코드 검사 → 결과 저장·화면 표시</text>
<text x="66" y="1150" font-size="21" fill="#63636F" font-weight="500" text-anchor="start">이 경로에서는 답변 생성·출력 AI 판정을 생략합니다.</text>
</g>
</svg>
