<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 UBot 시스템 구성</title>
  <desc id="desc">사용자 채널, 프론트엔드, 백엔드 API, AI Worker, 데이터 계층과 AI 런타임, 운영 관측과 연구 근거의 수직 흐름</desc>
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d32"/>
    </linearGradient>
    <filter id="shadowm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca3c7"/>
    </marker>
    <style>
      .title { fill:#f8fafc; font:700 30px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .subtitle { fill:#a8bad4; font:500 17px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .card-title { fill:#f8fafc; font:700 23px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .card-body { fill:#cfdbeb; font:500 18px 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .line { stroke:#8ca3c7; stroke-width:3; fill:none; marker-end:url(#arrowm); }
      .dash { stroke:#7188ad; stroke-width:2.5; fill:none; stroke-dasharray:8 7; marker-end:url(#arrowm); }
      .card { stroke-width:1.5; filter:url(#shadowm); }
    </style>
  </defs>

  <rect width="720" height="1160" rx="26" fill="url(#bgm)"/>
  <text x="42" y="54" class="title">UBot System Overview</text>
  <text x="42" y="84" class="subtitle">운영 경로와 실험 근거를 분리합니다.</text>

  <rect x="42" y="118" width="636" height="82" rx="18" fill="#17243a" stroke="#30435f" class="card"/>
  <text x="360" y="151" text-anchor="middle" class="card-title">고객 · 상담사 · 관리자 · 운영자</text>
  <text x="360" y="180" text-anchor="middle" class="card-body">질문, 상담, 지식 관리와 운영 대응</text>

  <rect x="120" y="244" width="480" height="100" rx="20" fill="#12345a" stroke="#3282c8" class="card"/>
  <text x="360" y="282" text-anchor="middle" class="card-title">UBot-FE</text>
  <text x="360" y="316" text-anchor="middle" class="card-body">고객 · 상담사 · 관리자 웹 경험</text>

  <rect x="120" y="390" width="480" height="118" rx="20" fill="#28356e" stroke="#6574d9" class="card"/>
  <text x="360" y="430" text-anchor="middle" class="card-title">UBot-BE API</text>
  <text x="360" y="463" text-anchor="middle" class="card-body">인증 · 권한 · 업무 규칙</text>
  <text x="360" y="490" text-anchor="middle" class="card-body">대화 · 상담 · 작업 접수와 조회</text>

  <rect x="120" y="554" width="480" height="118" rx="20" fill="#4c286d" stroke="#a66ad2" class="card"/>
  <text x="360" y="594" text-anchor="middle" class="card-title">AI Worker</text>
  <text x="360" y="627" text-anchor="middle" class="card-body">Retrieval · 모델 호출 · Guard</text>
  <text x="360" y="654" text-anchor="middle" class="card-body">결과 확정 · 작업 복구</text>

  <path d="M 360 200 V 242" class="line"/>
  <path d="M 360 344 V 388" class="line"/>
  <path d="M 360 508 V 552" class="line"/>

  <rect x="42" y="724" width="300" height="112" rx="20" fill="#124c4b" stroke="#2f9e9a" class="card"/>
  <text x="192" y="765" text-anchor="middle" class="card-title">PostgreSQL / pgvector</text>
  <text x="192" y="798" text-anchor="middle" class="card-body">제품·작업 원본</text>
  <text x="192" y="822" text-anchor="middle" class="card-body">FAQ · Vector 검색</text>

  <rect x="378" y="724" width="300" height="112" rx="20" fill="#16415a" stroke="#3d8bb8" class="card"/>
  <text x="528" y="765" text-anchor="middle" class="card-title">Redis</text>
  <text x="528" y="798" text-anchor="middle" class="card-body">작업 전달</text>
  <text x="528" y="822" text-anchor="middle" class="card-body">보조 상태</text>

  <rect x="120" y="880" width="480" height="96" rx="20" fill="#6b361d" stroke="#da7b3e" class="card"/>
  <text x="360" y="919" text-anchor="middle" class="card-title">LLM / Embedding Runtime</text>
  <text x="360" y="952" text-anchor="middle" class="card-body">모델 추론 자원</text>

  <path d="M 360 672 V 695 H 192 V 722" class="line"/>
  <path d="M 360 695 H 528 V 722" class="line"/>
  <path d="M 360 672 V 878" class="line"/>

  <rect x="120" y="848" width="480" height="34" rx="17" fill="#21334b" stroke="#587093"/>
  <text x="360" y="871" text-anchor="middle" class="subtitle">상태 확인 · 지표 · 로그 · 알림 · 런북</text>

  <rect x="42" y="1022" width="636" height="96" rx="20" fill="#18263c" stroke="#405574" class="card"/>
  <text x="360" y="1059" text-anchor="middle" class="card-title">Research / Benchmark → Decision</text>
  <text x="360" y="1092" text-anchor="middle" class="card-body">실험 근거를 검토해 운영 구현으로 연결</text>
  <path d="M 600 1050 C 665 1000 670 650 602 615" class="dash"/>
</svg>
