name: documentation-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation validator dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Verify canonical generated views
        run: python scripts/docs_tool.py generate --check
      - name: Validate structure and local references
        run: python scripts/docs_tool.py validate --mode template
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v
