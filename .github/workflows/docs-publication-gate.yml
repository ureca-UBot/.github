# This workflow does NOT deploy a site. Connect your publishing workflow to this gate.
name: docs-publication-gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  require-proven-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/docs_tool.py generate --check
      - run: python scripts/docs_tool.py validate --mode publish
      - run: python -m unittest discover -s tests -v
